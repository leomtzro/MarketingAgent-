<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--accent:#9b2226;--cream:#f7f4f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2a2a2a;font-family:"Inter",system-ui,sans-serif}
/* Canvas 1640x856.  desktop = centre 1640x624 (y 116..740)
   mobile = centre 1521x856 (x 59..1581)   profile photo ~200x200 bottom-left */
.cv{position:relative;width:1640px;height:856px;overflow:hidden;background:#1d1d1f;margin-bottom:30px}
.cv img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mk{position:absolute;left:124px;top:146px;height:62px}
.block{position:absolute;left:124px;top:264px;width:880px}
.lbl{font-size:21px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;margin-bottom:26px}
h1{font-family:"Fraunces",Georgia,serif;font-variation-settings:'SOFT' 0,'WONK' 0;
  font-size:76px;font-weight:700;line-height:1.04;letter-spacing:-.025em}
h1 em{font-style:normal}
p{font-size:25px;line-height:1.5;margin-top:30px;max-width:700px;font-weight:400}

/* ---- A · fachada clara ---- */
.light .wash{position:absolute;inset:0;
  background:linear-gradient(95deg,rgba(247,244,240,.94) 0%,rgba(247,244,240,.88) 30%,rgba(247,244,240,.42) 55%,rgba(247,244,240,0) 78%)}
.light .lbl{color:var(--accent)}
.light h1{color:var(--ink)} .light h1 em{color:var(--accent)}
.light p{color:#5b5b60}

/* ---- B · distrito oscuro ---- */
.dark .tint{position:absolute;inset:0;background:var(--accent);mix-blend-mode:multiply;opacity:.22}
.dark .scrim{position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(18,18,20,.92) 0%,rgba(18,18,20,.80) 34%,rgba(18,18,20,.40) 62%,rgba(18,18,20,.10) 100%)}
.dark .lbl{color:#efc9c6}
.dark h1{color:var(--cream)} .dark h1 em{color:#efc9c6}
.dark p{color:rgba(247,244,240,.80)}

.g{position:absolute;pointer-events:none;outline:2px dashed rgba(0,255,200,.8)}
.g.desk{left:0;top:116px;width:1640px;height:624px}
.g.mob{left:59px;top:0;width:1521px;height:856px}
.g.pfp{left:124px;top:620px;width:200px;height:200px;outline-color:rgba(255,130,0,.9)}
</style></head><body>

<section class="cv light" id="cA">
  <img class="bg" src="bg-fachada.png"><div class="wash"></div>
  <img class="mk" src="mark.png">
  <div class="block">
    <div class="lbl">Meridian · Tijuana</div>
    <h1>Marketing para clínicas<br><em>excepcionales</em>.</h1>
    <p>Revisamos 40 clínicas de Tijuana antes de escribir una sola palabra.</p>
  </div>
  <div class="g desk"></div><div class="g mob"></div><div class="g pfp"></div>
</section>

<section class="cv dark" id="cB">
  <img class="bg" src="bg-distrito.png"><div class="tint"></div><div class="scrim"></div>
  <img class="mk" src="mark-cream.png">
  <div class="block">
    <div class="lbl">Meridian · Tijuana</div>
    <h1>Marketing para clínicas<br><em>excepcionales</em>.</h1>
    <p>Revisamos 40 clínicas de Tijuana antes de escribir una sola palabra.</p>
  </div>
  <div class="g desk"></div><div class="g mob"></div><div class="g pfp"></div>
</section>
</body></html>
