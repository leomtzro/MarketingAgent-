<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--accent:#9b2226;--cream:#f7f4f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:"Inter",system-ui,sans-serif}
/* Upload canvas 1640x856.
   Desktop shows the centred 1640x624 band  -> safe y 116..740
   Mobile  shows the centred 1521x856 band  -> safe x  59..1581
   Profile picture overlaps bottom-left     -> keep x<360,y>600 clear */
.cv{position:relative;width:1640px;height:856px;overflow:hidden;background:#1d1d1f;margin-bottom:28px}
.cv img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(29,29,31,.90) 0%,rgba(29,29,31,.78) 34%,rgba(29,29,31,.40) 62%,rgba(29,29,31,.12) 100%)}
.tint{position:absolute;inset:0;background:var(--accent);mix-blend-mode:multiply;opacity:.26}
.mk{position:absolute;left:124px;top:146px;height:62px;opacity:.95}
.block{position:absolute;left:124px;top:264px;width:900px;color:var(--cream)}
.lbl{font-size:21px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
  color:#efc9c6;margin-bottom:26px}
h1{font-family:"Fraunces",Georgia,serif;font-variation-settings:'SOFT' 0,'WONK' 0;
  font-size:76px;font-weight:700;line-height:1.04;letter-spacing:-.025em}
h1 em{font-style:normal;color:#efc9c6}
p{font-size:25px;line-height:1.5;color:rgba(247,244,240,.80);margin-top:30px;max-width:720px;font-weight:400}
.rule{width:150px;height:4px;background:#efc9c6;margin-top:34px}
/* guides, removed before export */
.g{position:absolute;pointer-events:none;outline:2px dashed rgba(0,255,200,.75)}
.g.desk{left:0;top:116px;width:1640px;height:624px}
.g.mob{left:59px;top:0;width:1521px;height:856px}
.g.pfp{left:124px;top:620px;width:200px;height:200px;outline-color:rgba(255,120,0,.8)}
</style></head><body>
<section class="cv" id="c1">
  <img class="bg" src="bg-tijuana.png">
  <div class="tint"></div><div class="scrim"></div>
  <img class="mk" src="mark-cream.png">
  <div class="block">
    <div class="lbl">Meridian · Tijuana</div>
    <h1>Marketing para clínicas<br><em>excepcionales</em>.</h1>
    <p>Revisamos 40 clínicas de Tijuana antes de escribir una sola palabra.</p>
  </div>
  <div class="g desk"></div><div class="g mob"></div><div class="g pfp"></div>
</section>
</body></html>
