<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4f0;--ink:#1d1d1f;--accent:#9b2226;--cream:#f7f4f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#999;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 font-feature-settings:"ss01"}
.cv{width:1640px;height:856px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;
 display:flex;align-items:center}
.cv.red{background:var(--accent);color:var(--cream)}
/* skyline sits ON the horizon line, both inside the desktop crop (116-740) */
.sky{position:absolute;left:0;bottom:148px;width:100%;height:252px;color:var(--ink);z-index:1}
.red .sky{color:var(--cream)}
.horizon{position:absolute;left:0;bottom:148px;width:100%;height:3px;
 background:rgba(29,29,31,.22);z-index:1}
.red .horizon{background:rgba(247,244,240,.3)}
.block{position:absolute;top:158px;left:700px;max-width:880px;z-index:3}
.lbl{font-size:26px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
 color:var(--accent);margin-bottom:28px}
.red .lbl{color:var(--cream);opacity:.8}
h1{font-size:84px;font-weight:700;line-height:1.02;letter-spacing:-.042em}
h1 em{font-style:normal;color:var(--accent)}
.red h1 em{color:var(--cream);text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:13px}
p{font-size:30px;font-weight:450;line-height:1.4;color:#4a4a4e;margin-top:26px;max-width:720px}
.red p{color:rgba(247,244,240,.85)}
.mk{position:absolute;top:184px;left:150px;height:92px;z-index:3}
</style></head><body>
<section class="cv " id="t1">
  <svg class="sky" viewBox="0 0 1640 320" preserveAspectRatio="none" style="opacity:.13"><g fill="currentColor">
  <!-- low blocks, west -->
  <rect x="0" y="236" width="104" height="84"/>
  <rect x="112" y="206" width="62" height="114"/>
  <!-- monument on a plinth -->
  <rect x="196" y="282" width="34" height="38"/>
  <rect x="208" y="246" width="10" height="38"/>
  <circle cx="213" cy="238" r="11"/>
  <!-- mid blocks -->
  <rect x="256" y="222" width="88" height="98"/>
  <rect x="352" y="252" width="70" height="68"/>
  <!-- Arco Monumental: steel arch with lattice -->
  <path d="M452 320 L452 308 Q536 92 620 308 L620 320 L598 320 L598 300 Q536 134 474 300 L474 320 Z"/>
  <rect x="528" y="150" width="16" height="170"/>
  <path d="M486 250 L586 250 L586 262 L486 262 Z" opacity=".85"/>
  <path d="M500 206 L572 206 L572 218 L500 218 Z" opacity=".85"/>
  <!-- twin towers -->
  <rect x="652" y="156" width="52" height="164"/>
  <rect x="712" y="178" width="52" height="142"/>
  <rect x="652" y="142" width="112" height="16"/>
  <!-- blocks -->
  <rect x="792" y="240" width="96" height="80"/>
  <rect x="896" y="214" width="58" height="106"/>
  <!-- Agua Caliente tower: slender, pointed -->
  <rect x="996" y="190" width="30" height="130"/>
  <path d="M994 190 L1011 128 L1028 190 Z"/>
  <!-- CECUT: the sphere beside its block -->
  <circle cx="1178" cy="246" r="72"/>
  <rect x="1250" y="238" width="168" height="82"/>
  <rect x="1104" y="296" width="150" height="24"/>
  <!-- east blocks -->
  <rect x="1440" y="206" width="66" height="114"/>
  <rect x="1516" y="244" width="124" height="76"/>
</g>
</svg>
  <div class="horizon"></div>
  <img class="mk" src="mark.png">
  <div class="block">
    <div class="lbl">Meridian · Tijuana</div>
    <h1>Marketing para clínicas<br><em>excepcionales</em>.</h1>
    <p>Revisamos 40 clínicas de Tijuana antes de escribir una sola palabra.</p>
  </div>

</section></body></html>
