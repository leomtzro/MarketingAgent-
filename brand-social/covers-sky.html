<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4f0;--ink:#1d1d1f;--accent:#9b2226;--cream:#f7f4f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#999;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 font-feature-settings:"ss01"}
.cv{width:1640px;height:856px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden}
.cv.red{background:var(--accent);color:var(--cream)}
.sky{position:absolute;left:0;bottom:120px;width:100%;height:300px;color:var(--ink);z-index:1}
.red .sky{color:var(--cream)}
.horizon{position:absolute;left:0;bottom:120px;width:100%;height:3px;background:rgba(29,29,31,.2);z-index:1}
.red .horizon{background:rgba(247,244,240,.28)}
.block{position:absolute;top:150px;left:700px;max-width:880px;z-index:3}
.lbl{font-size:26px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
 color:var(--accent);margin-bottom:26px}
.red .lbl{color:var(--cream);opacity:.8}
h1{font-size:84px;font-weight:700;line-height:1.02;letter-spacing:-.042em}
h1 em{font-style:normal;color:var(--accent)}
.red h1 em{color:var(--cream);text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:13px}
p{font-size:30px;font-weight:450;line-height:1.4;color:#4a4a4e;margin-top:26px;max-width:720px}
.red p{color:rgba(247,244,240,.85)}
.mk{position:absolute;top:176px;left:150px;height:92px;z-index:3}
</style></head><body>
